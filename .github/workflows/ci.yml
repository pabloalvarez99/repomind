name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""
  COHERE_API_KEY: ""
  REPOMIND_CATALOG_PRODUCTION_RAG: ""

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/repomind

      - name: Test
        run: pytest -q

      - name: Prove the credential-free CLI and evaluation path
        run: |
          result=$(python -m repomind ask "Where is create_app defined?" --fixture mini)
          RESULT="$result" python -c 'import json, os; payload=json.loads(os.environ["RESULT"]); citation=payload["citations"][0]; assert citation["path"] == "app/main.py"; assert citation["start_line"] == 6'
          dogfood=$(python -m repomind ask "Where is run_query defined?" --repo production_rag)
          DOGFOOD="$dogfood" python -c 'import json, os; payload=json.loads(os.environ["DOGFOOD"]); assert len(payload["citations"]) == 1; assert payload["citations"][0]["path"] == "production_rag/query_pipeline.py"'
          python -m repomind.evals.run
          python -m repomind.evals.dogfood
          js_eval=$(python -c 'from repomind.evals.run import evaluate, default_dataset_path; import json; s=evaluate(default_dataset_path().with_name("js_questions.jsonl"), repo_id="mini_js"); print(json.dumps(s)); raise SystemExit(0 if s["failed"]==0 else 1)')
          echo "$js_eval"

      - name: Prove the credential-free HTTP path
        run: |
          python -m uvicorn repomind.main:app --host 127.0.0.1 --port 8020 > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8020/health > /dev/null; then
              break
            fi
            sleep 1
          done
          response=$(curl --fail --silent http://127.0.0.1:8020/v1/code/ask \
            -H 'content-type: application/json' \
            -d '{"question":"Where is create_app defined?","repo_id":"mini"}')
          RESPONSE="$response" python -c 'import json, os; payload=json.loads(os.environ["RESPONSE"]); citation=payload["citations"][0]; assert citation["path"] == "app/main.py"; assert citation["start_line"] == 6; assert citation["end_line"] == 9'
          dogfood=$(curl --fail --silent http://127.0.0.1:8020/v1/code/ask \
            -H 'content-type: application/json' \
            -d '{"question":"Where is run_query defined?","repo_id":"production_rag"}')
          DOGFOOD="$dogfood" python -c 'import json, os; payload=json.loads(os.environ["DOGFOOD"]); citation=payload["citations"][0]; assert citation["path"] == "production_rag/query_pipeline.py"; assert citation["start_line"] == 244; assert citation["end_line"] == 277'
          check_repo_id() {
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8020/v1/code/ask -H 'content-type: application/json' \
              -d "{\"question\":\"Where is create_app defined?\",\"repo_id\":\"$1\"}")
            test "$status" = "$2" || { echo "repo_id '$1' returned $status, expected $2"; exit 1; }
          }
          check_repo_id 'unknown' 404
          check_repo_id '../../etc' 400
          check_repo_id '' 422
          check_repo_id '   ' 422
          catalog=$(curl --fail --silent http://127.0.0.1:8020/v1/catalog)
          CATALOG="$catalog" python -c 'import json, os; entries=json.loads(os.environ["CATALOG"]); assert [e["repo_id"] for e in entries] == ["mini", "mini_js", "production_rag"]; assert all(len(e["tree_hash"]) == 64 and e["chunk_count"] > 0 for e in entries); by={e["repo_id"]:e for e in entries}; assert by["production_rag"]["source_sha"] == "3b54d85a9c0d3ba85bd0760058aafce76849d1f7"'
          symbols=$(curl --fail --silent 'http://127.0.0.1:8020/v1/code/symbols?repo_id=mini')
          SYMBOLS="$symbols" python -c 'import json, os; payload=json.loads(os.environ["SYMBOLS"]); assert payload[0]["qualname"] == "create_app"'
          js=$(curl --fail --silent http://127.0.0.1:8020/v1/code/ask \
            -H 'content-type: application/json' \
            -d '{"question":"Where is foo defined?","repo_id":"mini_js"}')
          JS="$js" python -c 'import json, os; payload=json.loads(os.environ["JS"]); citation=payload["citations"][0]; assert citation["path"] == "src/foo.js"; assert citation["start_line"] >= 1'
          history=$(curl --silent --output /tmp/history.json --write-out '%{http_code}' \
            'http://127.0.0.1:8020/v1/code/history?repo_id=mini&path=app/main.py')
          test "$history" = "200" || { echo "history expected 200 from committed snapshot, got $history"; cat /tmp/history.json; exit 1; }
          HISTORY="$(cat /tmp/history.json)" python -c 'import json, os; body=json.loads(os.environ["HISTORY"]); assert body["repo_id"]=="mini"; assert body["path"]=="app/main.py"; assert body["entries"] and body["entries"][0]["sha"]'
          history_missing=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:8020/v1/code/history?repo_id=mini&path=app/nope.py')
          test "$history_missing" = "404" || { echo "history missing path expected 404, got $history_missing"; exit 1; }
          refs=$(curl --fail --silent 'http://127.0.0.1:8020/v1/code/refs?repo_id=mini&symbol=create_app')
          REFS="$refs" python -c 'import json, os; body=json.loads(os.environ["REFS"]); assert body["qualname"]=="create_app"; assert len(body["callers"]) >= 1'
          leaf=$(curl --fail --silent 'http://127.0.0.1:8020/v1/code/refs?repo_id=mini&symbol=health')
          LEAF="$leaf" python -c 'import json, os; body=json.loads(os.environ["LEAF"]); assert body["callers"] == []'
          ui=$(curl --fail --silent --get http://127.0.0.1:8020/ask \
            --data-urlencode 'question=Where is run_query defined?' \
            --data-urlencode 'repo_id=production_rag')
          UI="$ui" python -c 'import os; page=os.environ["UI"]; assert "production_rag/query_pipeline.py:244-277" in page; assert "request_id" in page; assert "Who calls a symbol" in page'

      - name: Show the API log after a failure
        if: failure()
        run: cat api.log || true
