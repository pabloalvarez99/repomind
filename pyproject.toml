[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repomind"
version = "0.2.0"
description = "Offline codebase Q&A with AST-aware chunks and path:line citations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pathspec>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
repomind = "repomind.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]
docs = [
    "playwright>=1.48",
]
# Optional grammar path. CI never installs this; free-path JS uses the pure
# scanner in repomind.ingest.chunk_javascript. Tests that need the grammar use
# pytest.importorskip / the treesitter marker and are skipped by default.
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repomind"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/mini_repo" = "repomind/fixtures/mini_repo"
"fixtures/production_rag" = "repomind/fixtures/production_rag"
"fixtures/mini_js" = "repomind/fixtures/mini_js"
"data/eval" = "repomind/data/eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "treesitter: requires the optional [treesitter] extra (skipped in default CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"fixtures/**" = ["ANN", "D"]
"fixtures/production_rag/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# tests/test_capture_assets.py imports the sidecar writer so the test and the tool
# authors run cannot drift apart; scripts/ is not a package.
mypy_path = "scripts"
